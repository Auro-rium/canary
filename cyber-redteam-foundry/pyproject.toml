[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyber-redteam-foundry"
version = "0.1.0"
description = "Local cybersecurity red-team and defense loop for AI agents using Azure AI Foundry"
requires-python = ">=3.10,<3.14"
authors = [
    {name = "Cyber Red Team", email = "team@example.com"},
]
dependencies = [
    "azure-ai-projects>=2.0.0",
    "azure-ai-evaluation[redteam]>=0.1.0",
    "azure-identity>=1.14.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "langgraph>=0.0.1",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langchain>=0.1.0",
    "langchain-openai>=0.1.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.24.0",
    "jsonschema>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "ipython>=8.0.0",
]

[project.scripts]
cyber-rt = "cyberredteam.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/cyberredteam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --cov=src/cyberredteam --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py311"]
