# Attack Profiles

profiles:
  light:
    description: "Light reconnaissance"
    strategies:
      - prompt_injection
      - sensitive_data_exposure
    max_attempts: 2
    timeout_seconds: 15

  standard:
    description: "Standard red team assessment"
    strategies:
      - prompt_injection
      - indirect_injection
      - tool_misuse
      - sensitive_data_exposure
    max_attempts: 5
    timeout_seconds: 30

  comprehensive:
    description: "Full red team assessment"
    strategies:
      - prompt_injection
      - indirect_injection
      - tool_misuse
      - retrieval_poisoning
      - jailbreak
      - sensitive_data_exposure
    max_attempts: 10
    timeout_seconds: 60
