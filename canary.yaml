version: 1

# Commit this with the agent code. Endpoint credentials belong in CI secrets.
target:
  # The Action replaces this from its target-url input / CANARY_TARGET_URL.
  # It must be a public preview URL reachable by the hosted Canary API.
  endpoint: ${CANARY_TARGET_URL}
  health: /health
  request_template: '{"message":"{{PROMPT}}"}'
  response_path: response

security:
  strategies:
    - prompt_injection
    - indirect_injection
    - tool_misuse
    - sensitive_data_exposure
    - authorization_boundary
    - retrieval_poisoning
    - jailbreak
    - memory_poisoning
    - workflow_manipulation
    - agent_handoff_corruption
    - instruction_hierarchy
    - context_isolation

gate:
  block_on:
    - critical
    - high
  warn_on:
    - medium
    - low
  max_new_blocking_findings: 0
  max_new_nonblocking_findings: null
