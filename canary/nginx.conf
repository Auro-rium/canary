server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/x-javascript;
    gzip_min_length 256;

    # API proxy → redteam-backend container (internal port 8001)
    location /api/ {
        proxy_pass         http://redteam-backend:8001/api/;
        proxy_http_version 1.1;

        # Required for SSE streaming
        proxy_set_header   Connection      '';
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Disable all buffering for SSE
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # Tells upstream nginx proxies not to buffer either
        add_header         X-Accel-Buffering no;
    }

    # SPA: all non-asset paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
