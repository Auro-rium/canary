name: Agent Canary
description: Attack a registered preview agent and block a pull request on new security regressions.
inputs:
  api-url:
    description: Base URL for the hosted Agent Canary API.
    required: true
  api-token:
    description: Canary API bearer token.
    required: true
  project-id:
    description: Registered Canary project ID.
    required: true
  commit-sha:
    description: Revision being evaluated. Defaults to the current GitHub SHA.
    required: false
    default: ${{ github.sha }}
  environment:
    description: Release environment.
    required: false
    default: preview
  poll-seconds:
    description: Maximum seconds to wait for the red-team run.
    required: false
    default: "600"
outputs:
  decision:
    description: Release-gate decision: pass, warn, or block.
    value: ${{ steps.wait.outputs.decision }}
  release-id:
    description: Canary release record ID.
    value: ${{ steps.create.outputs.release_id }}
runs:
  using: composite
  steps:
    - id: create
      shell: bash
      env:
        CANARY_API_URL: ${{ inputs.api-url }}
        CANARY_API_TOKEN: ${{ inputs.api-token }}
        CANARY_PROJECT_ID: ${{ inputs.project-id }}
        CANARY_COMMIT_SHA: ${{ inputs.commit-sha }}
        CANARY_ENVIRONMENT: ${{ inputs.environment }}
      run: |
        set -euo pipefail
        response="$(curl --fail-with-body --silent --show-error \
          --request POST "${CANARY_API_URL%/}/api/projects/${CANARY_PROJECT_ID}/releases" \
          --header "Authorization: Bearer ${CANARY_API_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{\"commit_sha\":\"${CANARY_COMMIT_SHA}\",\"environment\":\"${CANARY_ENVIRONMENT}\"}")"
        release_id="$(jq --raw-output '.release_id' <<<"${response}")"
        test -n "${release_id}" && test "${release_id}" != "null"
        echo "release_id=${release_id}" >> "$GITHUB_OUTPUT"
    - id: wait
      shell: bash
      env:
        CANARY_API_URL: ${{ inputs.api-url }}
        CANARY_API_TOKEN: ${{ inputs.api-token }}
        CANARY_RELEASE_ID: ${{ steps.create.outputs.release_id }}
        CANARY_POLL_SECONDS: ${{ inputs.poll-seconds }}
      run: |
        set -euo pipefail
        deadline=$((SECONDS + CANARY_POLL_SECONDS))
        while (( SECONDS < deadline )); do
          release="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CANARY_API_TOKEN}" \
            "${CANARY_API_URL%/}/api/releases/${CANARY_RELEASE_ID}")"
          status="$(jq --raw-output '.status' <<<"${release}")"
          if [[ "${status}" == "completed" || "${status}" == "failed" ]]; then
            break
          fi
          sleep 10
        done
        if [[ "${status}" != "completed" && "${status}" != "failed" ]]; then
          echo "Agent Canary timed out waiting for release ${CANARY_RELEASE_ID}" >&2
          exit 1
        fi
        decision="$(jq --raw-output '.decision // "block"' <<<"${release}")"
        echo "decision=${decision}" >> "$GITHUB_OUTPUT"
        {
          echo "## Agent Canary"
          echo
          echo "Release: \`${CANARY_RELEASE_ID}\`"
          echo "Decision: **${decision^^}**"
          echo
          echo '```json'
          jq '{summary, comparison}' <<<"${release}"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        [[ "${decision}" != "block" ]]
