name: Agent Canary
description: Run an agent security release gate from the repository's checked-in canary.yaml.
inputs:
  api-url:
    description: Base URL for the hosted Canary API.
    required: true
  api-token:
    description: Scoped Canary project token. Keep this in GitHub Actions secrets.
    required: true
  target-url:
    description: Public preview-agent chat endpoint. Overrides target.endpoint in canary.yaml.
    required: false
    default: ""
  baseline-url:
    description: Stable trusted agent endpoint used for baseline replay. If omitted, Canary uses the accepted baseline snapshot.
    required: false
    default: ""
  target-verification-token:
    description: One-time token echoed by the preview agent to prove target ownership.
    required: false
    default: ""
  config-path:
    description: Path to the checked-in Canary configuration.
    required: false
    default: canary.yaml
  start-command:
    description: Optional command that starts the agent before Canary probes it.
    required: false
    default: ""
  health-url:
    description: Optional health endpoint. Overrides target.health in canary.yaml.
    required: false
    default: ""
  commit-sha:
    description: Revision being evaluated.
    required: false
    default: ${{ github.event.pull_request.head.sha || github.sha }}
  git-ref:
    description: Branch/ref being evaluated; only the default branch may advance the baseline.
    required: false
    default: ${{ github.head_ref || github.ref_name }}
  default-branch:
    description: Repository branch that owns the safe baseline.
    required: false
    default: ${{ github.event.repository.default_branch || 'main' }}
  environment:
    description: Environment label shown in release history.
    required: false
    default: preview
  poll-seconds:
    description: Maximum seconds to wait for the real red-team run.
    required: false
    default: "900"
  report-dir:
    description: Directory where JSON and Markdown report artifacts are written.
    required: false
    default: canary-report
outputs:
  decision:
    description: "Release-gate decision: pass, warn, or block."
    value: ${{ steps.execute.outputs.decision }}
  release-id:
    description: Immutable Canary release record ID.
    value: ${{ steps.execute.outputs.release_id }}
  report-dir:
    description: Directory containing report.json and report.md.
    value: ${{ steps.execute.outputs.report_dir }}
  security-score:
    description: Candidate security score.
    value: ${{ steps.execute.outputs.security_score }}
  baseline-score:
    description: Accepted baseline security score.
    value: ${{ steps.execute.outputs.baseline_score }}
  score-delta:
    description: Candidate minus baseline score.
    value: ${{ steps.execute.outputs.score_delta }}
  new-regressions:
    description: Number of newly introduced regressions.
    value: ${{ steps.execute.outputs.new_regressions }}
  known-findings:
    description: Number of known baseline findings.
    value: ${{ steps.execute.outputs.known_findings }}
  resolved-findings:
    description: Number of resolved baseline findings.
    value: ${{ steps.execute.outputs.resolved_findings }}
  coverage:
    description: Executed configured security surface percentage.
    value: ${{ steps.execute.outputs.coverage }}
runs:
  using: composite
  steps:
    - id: execute
      shell: bash
      env:
        CANARY_API_URL: ${{ inputs.api-url }}
        CANARY_API_TOKEN: ${{ inputs.api-token }}
        CANARY_TARGET_URL: ${{ inputs.target-url }}
        CANARY_BASELINE_URL: ${{ inputs.baseline-url }}
        CANARY_TARGET_VERIFICATION_TOKEN: ${{ inputs.target-verification-token }}
        CANARY_CONFIG_PATH: ${{ inputs.config-path }}
        CANARY_START_COMMAND: ${{ inputs.start-command }}
        CANARY_HEALTH_URL: ${{ inputs.health-url }}
        CANARY_COMMIT_SHA: ${{ inputs.commit-sha }}
        CANARY_GIT_REF: ${{ inputs.git-ref }}
        CANARY_DEFAULT_BRANCH: ${{ inputs.default-branch }}
        CANARY_ENVIRONMENT: ${{ inputs.environment }}
        CANARY_POLL_SECONDS: ${{ inputs.poll-seconds }}
        CANARY_REPORT_DIR: ${{ inputs.report-dir }}
        CANARY_REPOSITORY: ${{ github.repository }}
        CANARY_EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail
        test -f "$CANARY_CONFIG_PATH"
        mkdir -p "$CANARY_REPORT_DIR"

        # Ruby ships on GitHub-hosted runners and provides a real YAML parser;
        # no untrusted shell interpolation or third-party config action needed.
        ruby <<'RUBY'
        require "yaml"
        require "json"
        require "uri"

        config = YAML.safe_load(File.read(ENV.fetch("CANARY_CONFIG_PATH")), aliases: false) || {}
        target = config.fetch("target") { raise "canary.yaml must contain target" }
        configured_endpoint = target.fetch("endpoint") { raise "target.endpoint is required" }.to_s
        endpoint = ENV.fetch("CANARY_TARGET_URL", "").strip
        endpoint = configured_endpoint if endpoint.empty?
        endpoint = endpoint.gsub("${CANARY_TARGET_URL}", ENV.fetch("CANARY_TARGET_URL", ""))
        raise "target endpoint is empty; set target-url or CANARY_TARGET_URL" if endpoint.empty? || endpoint.include?("${")

        baseline = config.fetch("baseline", {}) || {}
        baseline_endpoint = baseline.fetch("endpoint", "").to_s.strip
        baseline_endpoint = baseline_endpoint.gsub("${CANARY_BASELINE_URL}", ENV.fetch("CANARY_BASELINE_URL", ""))

        health = ENV.fetch("CANARY_HEALTH_URL", "").strip
        health = target["health"].to_s if health.empty? && target["health"]
        if !health.empty? && health.start_with?("/")
          uri = URI(endpoint)
          health = "#{uri.scheme}://#{uri.host}#{uri.port ? ":#{uri.port}" : ""}#{health}"
        end

        request_template = target["request"] || target["request_template"] || '{"message":"{{PROMPT}}"}'
        request_template = JSON.generate(request_template) unless request_template.is_a?(String)
        request = {
          repository: ENV.fetch("CANARY_REPOSITORY"),
          commit_sha: ENV.fetch("CANARY_COMMIT_SHA"),
          ref: ENV.fetch("CANARY_GIT_REF"),
          event_name: ENV.fetch("CANARY_EVENT_NAME"),
          default_branch: ENV.fetch("CANARY_DEFAULT_BRANCH"),
          environment: ENV.fetch("CANARY_ENVIRONMENT"),
          endpoint: endpoint,
          baseline_endpoint: baseline_endpoint.empty? ? nil : baseline_endpoint,
          request_template: request_template,
          response_path: target["response_path"],
          strategies: (config.dig("security", "strategies") || []),
          gate: (config["gate"] || {})
        }
        verification_token = ENV.fetch("CANARY_TARGET_VERIFICATION_TOKEN", "").strip
        request[:verification_token] = verification_token unless verification_token.empty?
        report_dir = ENV.fetch("CANARY_REPORT_DIR")
        File.write(File.join(report_dir, "release-request.json"), JSON.pretty_generate(request))
        File.write(File.join(report_dir, ".health-url"), health) unless health.empty?
        RUBY

        agent_pid=""
        cleanup() {
          if [[ -n "$agent_pid" ]] && kill -0 "$agent_pid" 2>/dev/null; then
            kill "$agent_pid" 2>/dev/null || true
          fi
        }
        trap cleanup EXIT
        if [[ -n "$CANARY_START_COMMAND" ]]; then
          nohup bash -lc "$CANARY_START_COMMAND" >"$CANARY_REPORT_DIR/agent.log" 2>&1 &
          agent_pid="$!"
        fi

        health_url=""
        [[ -f "$CANARY_REPORT_DIR/.health-url" ]] && health_url="$(<"$CANARY_REPORT_DIR/.health-url")"
        if [[ -n "$health_url" ]]; then
          deadline=$((SECONDS + 90))
          until curl --fail --silent --show-error --max-time 5 "$health_url" >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo "Agent did not become healthy at $health_url" >&2
              exit 1
            fi
            sleep 2
          done
        fi

        response="$(curl --fail-with-body --silent --show-error \
          --request POST "${CANARY_API_URL%/}/api/ci/releases" \
          --header "Authorization: Bearer ${CANARY_API_TOKEN}" \
          --header "Content-Type: application/json" \
          --data @"$CANARY_REPORT_DIR/release-request.json")"
        release_id="$(jq --raw-output '.release_id' <<<"$response")"
        test -n "$release_id" && test "$release_id" != "null"
        echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

        status="running"
        deadline=$((SECONDS + CANARY_POLL_SECONDS))
        while (( SECONDS < deadline )); do
          release="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CANARY_API_TOKEN}" \
            "${CANARY_API_URL%/}/api/releases/${release_id}")"
          status="$(jq --raw-output '.status' <<<"$release")"
          if [[ "$status" == "completed" || "$status" == "failed" ]]; then break; fi
          sleep 10
        done
        if [[ "$status" != "completed" && "$status" != "failed" ]]; then
          echo "Agent Canary timed out waiting for release $release_id" >&2
          exit 1
        fi

        decision="$(jq --raw-output '.decision // "block"' <<<"$release")"
        curl --fail-with-body --silent --show-error \
          --header "Authorization: Bearer ${CANARY_API_TOKEN}" \
          "${CANARY_API_URL%/}/api/releases/${release_id}/report" \
          > "$CANARY_REPORT_DIR/report.json"
        curl --fail-with-body --silent --show-error \
          --header "Authorization: Bearer ${CANARY_API_TOKEN}" \
          "${CANARY_API_URL%/}/api/releases/${release_id}/report.md" \
          > "$CANARY_REPORT_DIR/report.md"
        echo "decision=$decision" >> "$GITHUB_OUTPUT"
        echo "report_dir=$CANARY_REPORT_DIR" >> "$GITHUB_OUTPUT"
        coverage="$(jq -r '.coverage.percentage // .summary.coverage // 0' <<<"$release")"
        candidate_score="$(jq -r '.candidate_score // .summary.security_score // 0' <<<"$release")"
        baseline_score="$(jq -r '.baseline_score // ""' <<<"$release")"
        score_delta="$(jq -r '.score_delta // ""' <<<"$release")"
        new_regressions="$(jq -r '(.comparison.new_regression_ids // []) | length' <<<"$release")"
        known_findings="$(jq -r '.comparison.known // 0' <<<"$release")"
        resolved_findings="$(jq -r '.comparison.resolved // 0' <<<"$release")"
        echo "security_score=$candidate_score" >> "$GITHUB_OUTPUT"
        echo "baseline_score=$baseline_score" >> "$GITHUB_OUTPUT"
        echo "score_delta=$score_delta" >> "$GITHUB_OUTPUT"
        echo "new_regressions=$new_regressions" >> "$GITHUB_OUTPUT"
        echo "known_findings=$known_findings" >> "$GITHUB_OUTPUT"
        echo "resolved_findings=$resolved_findings" >> "$GITHUB_OUTPUT"
        echo "coverage=$coverage" >> "$GITHUB_OUTPUT"
        {
          echo "## Agent Canary Security Gate"
          echo
          echo "**Decision:** ${decision^^}"
          echo
          echo "| Metric | Value |"
          echo "|---|---:|"
          echo "| Baseline score | ${baseline_score:-n/a} |"
          echo "| Candidate score | $candidate_score |"
          echo "| Score delta | ${score_delta:-n/a} |"
          echo "| New regressions | $new_regressions |"
          echo "| Known findings | $known_findings |"
          echo "| Resolved findings | $resolved_findings |"
          echo "| Coverage | ${coverage}% |"
          echo
        } >> "$GITHUB_STEP_SUMMARY"
        cat "$CANARY_REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Upload Canary evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: canary-security-report-${{ inputs.commit-sha }}
        path: ${{ inputs.report-dir }}
        if-no-files-found: warn
        retention-days: 14

    - name: Enforce release gate
      shell: bash
      env:
        CANARY_DECISION: ${{ steps.execute.outputs.decision }}
      run: |
        set -euo pipefail
        test -n "$CANARY_DECISION"
        if [[ "$CANARY_DECISION" == "block" ]]; then
          echo "Agent Canary blocked this release because it introduced policy-violating security regressions." >&2
          exit 1
        fi
