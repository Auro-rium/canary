name: canary-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-redteam-foundry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q

  gate:
    # Self-contained demo: no secrets, no network. It uses SYNTHETIC campaigns
    # (a real run needs `cyber-rt gate --target --baseline` against Postgres and a
    # worker: the QueueCampaignLauncher). A healthy candidate must pass and an
    # injected regression must fail the gate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-redteam-foundry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-extras
      - name: Gate passes on a healthy candidate
        run: uv run cyber-rt gate --demo --json-out gate-demo.json
      - name: Gate fails on an injected regression
        run: |
          set +e
          uv run cyber-rt gate --demo --demo-inject-regression
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (regression), got $code"
            exit 1
          fi

  calibration:
    # WP5 judge calibration regression check. Needs a BACKBOARD_API_KEY secret
    # (unavailable to fork PRs: the step then fails closed, by design). When an
    # accepted baseline report is committed it is passed via --compare;
    # without one the run still checks the valid-vote rate and reports metrics.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-redteam-foundry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-extras
      - name: Calibration regression check
        env:
          BACKBOARD_API_KEY: ${{ secrets.BACKBOARD_API_KEY }}
        run: |
          baseline=eval/baselines/calibration_report.json
          args="--out-dir runs/calibration"
          if [ -f "$baseline" ]; then
            args="$args --compare $baseline"
          else
            echo "no accepted baseline at $baseline; running without --compare"
          fi
          uv run python -m cyberredteam.eval.calibrate $args

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: canary/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npx vitest run
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Bundle secret scan
        run: |
          # Patterns live in .github/bundle-secret-patterns.txt (unit-tested).
          # Filenames only (-l): never echo a matched secret into the log.
          if grep -rlEf ../.github/bundle-secret-patterns.txt dist/; then
            echo "token-like string found in the files listed above"
            exit 1
          fi
