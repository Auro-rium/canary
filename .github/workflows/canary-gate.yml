name: canary-gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canary-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-redteam-foundry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-extras
      - run: uv run ruff check .
      # These 6 failures predate the multi-turn rebuild and are tracked for the
      # purge pass. Deselect exactly these node ids and nothing else.
      - run: |
          uv run pytest -q \
            --deselect tests/test_tools.py::test_http_adapter_default_contract_unchanged \
            --deselect tests/test_tools.py::test_http_adapter_custom_template_and_response_path \
            --deselect tests/test_tools.py::test_http_adapter_response_path_fallback_to_heuristic \
            --deselect tests/test_tools.py::test_http_adapter_custom_headers_merged_with_defaults \
            --deselect tests/test_evaluator_phase3.py::test_canary_in_evaluator_triggers_success \
            --deselect tests/test_langgraph.py::TestParallelFanOut::test_three_branches_dispatch_and_tag_correctly

  gate:
    # Self-contained demo: no secrets, no network. It uses SYNTHETIC campaigns
    # (the real CampaignLauncher is not wired yet). A healthy candidate must pass
    # and an injected regression must fail the gate.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-redteam-foundry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-extras
      - name: Gate passes on a healthy candidate
        run: uv run cyber-rt gate --demo --json-out gate-demo.json
      - name: Gate fails on an injected regression
        run: |
          set +e
          uv run cyber-rt gate --demo --demo-inject-regression
          code=$?
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1 (regression), got $code"
            exit 1
          fi

  calibration:
    # WP5 judge calibration regression check; runs only once eval/calibrate.py exists.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cyber-redteam-foundry
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Calibration regression check
        run: |
          if [ -f eval/calibrate.py ]; then
            uv sync --all-extras
            uv run python eval/calibrate.py
          elif [ -f src/cyberredteam/eval/calibrate.py ]; then
            uv sync --all-extras
            uv run python -m cyberredteam.eval.calibrate
          else
            echo "eval/calibrate.py not present yet; skipping"
          fi

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canary
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: canary/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Bundle secret scan
        run: |
          # Patterns live in .github/bundle-secret-patterns.txt (unit-tested).
          # Filenames only (-l): never echo a matched secret into the log.
          if grep -rlEf ../.github/bundle-secret-patterns.txt dist/; then
            echo "token-like string found in the files listed above"
            exit 1
          fi
