# Ports: 8000 (nginx/React SPA), 8001 (FastAPI/uvicorn direct access)
#   nginx reverse-proxies /api/* to redteam-backend:8001 internally.
#   8001 is also mapped to the host for direct FastAPI/uvicorn inspection.

networks:
  canary-net:
    driver: bridge

services:

  # ── Internal: AI target agent (sandbox LLM) ──────────────────────────────
  target-agent:
    build:
      context: ./cyber-redteam-foundry
      dockerfile: Dockerfile
    command: python -m target_agent.server --host 0.0.0.0 --port 9000
    env_file:
      - ./cyber-redteam-foundry/.env
    environment:
      - RUNNING_IN_DOCKER=true
    ports:
      - "9000:9000"
    networks:
      - canary-net
    restart: unless-stopped

  # ── Internal: FastAPI red-team backend (port 8001) ───────────────────────
  redteam-backend:
    build:
      context: ./cyber-redteam-foundry
      dockerfile: Dockerfile
    command: >
      uvicorn cyberredteam.api:app
        --host 0.0.0.0
        --port 8001
        --timeout-keep-alive 300
    env_file:
      - ./cyber-redteam-foundry/.env
    environment:
      - RUNNING_IN_DOCKER=true
    ports:
      - "8001:8001"
    volumes:
      - ./runs:/app/runs
      - ./reports:/app/reports
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      - target-agent

  # ── Public: nginx + React SPA (host port 8000 → container port 80) ───────
  canary-frontend:
    build:
      context: ./canary
      dockerfile: Dockerfile
      args:
        # Empty string → relative URL → nginx proxies /api/* to backend
        VITE_API_URL: ""
        # Must match API_SECRET_KEY in cyber-redteam-foundry/.env
        VITE_API_TOKEN: "${VITE_API_TOKEN}"
    ports:
      - "8000:80"
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      - redteam-backend
