# Ports: 8000 (nginx/React SPA), 8001 (FastAPI/uvicorn direct access)
#   nginx reverse-proxies /api/* to redteam-backend:8001 internally.
#   8001 is also mapped to the host for direct FastAPI/uvicorn inspection.
#
# A local HTTP target agent runs OUTSIDE Docker on the host:
#   cd cyber-redteam-foundry && PYTHONPATH=src python -m target_agent.server --port 9000
# The backend reaches it via host.docker.internal:9000 (extra_hosts below).

networks:
  canary-net:
    driver: bridge

services:

  # ── Internal: Redis queue for optional durable release workers ────────────
  # Local users can leave RELEASE_EXECUTION_MODE=thread. Hosted deployments
  # use the same contract with ElastiCache instead of this container.
  canary-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - canary-redis-data:/data
    networks:
      - canary-net
    restart: unless-stopped

  # ── Internal: FastAPI red-team backend (port 8001) ───────────────────────
  redteam-backend:
    build:
      context: ./cyber-redteam-foundry
      dockerfile: Dockerfile
    command: >
      uvicorn cyberredteam.api:app
        --host 0.0.0.0
        --port 8001
        --timeout-keep-alive 300
    env_file:
      - ./cyber-redteam-foundry/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - REDIS_URL=redis://canary-redis:6379/0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    volumes:
      - ./runs:/app/runs
      - ./reports:/app/reports
    networks:
      - canary-net
    restart: unless-stopped

  # ── Public: nginx + React SPA (host port 8000 → container port 80) ───────
  canary-frontend:
    build:
      context: ./canary
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      # Server-side nginx proxy only; never bake this into a VITE_* variable.
      API_SECRET_KEY: "${API_SECRET_KEY:?export API_SECRET_KEY before docker compose up}"
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      - redteam-backend

  # ── Internal: durable release worker (enabled when mode=rq) ──────────────
  redteam-worker:
    build:
      context: ./cyber-redteam-foundry
      dockerfile: Dockerfile
    command: canary-worker
    env_file:
      - ./cyber-redteam-foundry/.env
    environment:
      - RUNNING_IN_DOCKER=true
      - REDIS_URL=redis://canary-redis:6379/0
    volumes:
      - ./runs:/app/runs
      - ./reports:/app/reports
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      - canary-redis

volumes:
  canary-redis-data:
