# Ports: 8000 (nginx/React SPA), 8001 (FastAPI/uvicorn direct access)
#   nginx reverse-proxies /api/* to redteam-backend:8001 internally.
#   8001 is also mapped to the host for direct FastAPI/uvicorn inspection.
#
# Owned HTTP targets may run outside Docker on the host. The backend reaches
# localhost targets through host.docker.internal (extra_hosts below).

networks:
  canary-net:
    driver: bridge

services:

  # ── Postgres + pgvector for the v2 data layer (no host port by default) ──
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: canary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: canary
    volumes:
      - canary-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canary -d canary"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - canary-net
    restart: unless-stopped

  # ── Internal: FastAPI red-team backend (port 8001) ───────────────────────
  redteam-backend:
    build:
      context: ./cyber-redteam-foundry
      dockerfile: Dockerfile
    # Migrations (alembic head + procrastinate schema) run before the API starts.
    command: >
      sh -c "python -m cyberredteam.jobs.migrate &&
      exec uvicorn cyberredteam.api:app --host 0.0.0.0 --port 8001 --timeout-keep-alive 300"
    env_file:
      - ./cyber-redteam-foundry/.env
    environment:
      - RUNNING_IN_DOCKER=true
      # Local http dev only. Production MUST NOT set CANARY_ENV (default: production).
      - CANARY_ENV=dev
      - DATABASE_URL=postgresql+psycopg://canary:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/canary
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - ./runs:/app/runs
      - ./reports:/app/reports
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  # ── Worker: runs campaigns from the Postgres queue (separate process) ────
  # Same image as the API; starts after the API is healthy so migrations are done.
  redteam-worker:
    build:
      context: ./cyber-redteam-foundry
      dockerfile: Dockerfile
    command: ["python", "-m", "cyberredteam.jobs.worker"]
    # Must exceed the worker's graceful shutdown (WORKER_SHUTDOWN_GRACEFUL_S, default 25s)
    # so in-flight campaigns are released for resume before SIGKILL.
    stop_grace_period: 40s
    env_file:
      - ./cyber-redteam-foundry/.env
    environment:
      - RUNNING_IN_DOCKER=true
      # Local http dev only. Production MUST NOT set CANARY_ENV (default: production).
      - CANARY_ENV=dev
      - DATABASE_URL=postgresql+psycopg://canary:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/canary
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./runs:/app/runs
      - ./reports:/app/reports
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redteam-backend:
        condition: service_healthy

  # ── Public: nginx + React SPA (host port 8000 → container port 80) ───────
  canary-frontend:
    build:
      context: ./canary
      dockerfile: Dockerfile
      args:
        # Empty string → relative URL → nginx proxies /api/* to backend
        VITE_API_URL: ""
        # No token build arg: VITE_* values ship in the public bundle. Users sign
        # in with OIDC; nginx forwards their session cookie (WP8).
    ports:
      - "8000:80"
    networks:
      - canary-net
    restart: unless-stopped
    depends_on:
      - redteam-backend

volumes:
  canary-pgdata:
